# Reference end state of the TaskRun: the same as the starting one, created
# again so that it runs the fixed Task.
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: image-build-run
  namespace: starfleet
spec:
  taskRef:
    name: image-build
  params:
    - name: IMAGE
      value: registry.registry.svc.cluster.local:5000/starfleet/bridge-app:1.1
    - name: CONTEXT
      value: bridge-app
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: bridge-source
