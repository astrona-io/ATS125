# Fix A Failing TaskRun With Timeout And Retries
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-lab-040-01-setup"
      description: "Applies the Task flaky-sync and a TaskRun flaky-sync-failed that failed without retries"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-flaky-sync-run"
      description: "Confirms flaky-sync-run uses the Task with retries, a timeout and two recorded failed attempts"
      type: "file"
      source: "validation/validate-flaky-sync-run.sh"
    - name: "validate-flaky-sync-settings"
      description: "Confirms the timeout is set and not unlimited, and the retried run reported the final attempt number"
      type: "file"
      source: "validation/validate-flaky-sync-settings.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
