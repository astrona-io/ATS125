# Rescue A Night Of Report Runs
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-capstone-040-setup"
      description: "Applies the Task nightly-report and three TaskRuns: one timed out, one running away, one held"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-runaway-and-held"
      description: "Confirms nightly-report-runaway was cancelled and nightly-report-held was released and succeeded"
      type: "file"
      source: "validation/validate-runaway-and-held.sh"
    - name: "validate-retry-run"
      description: "Confirms nightly-report-retry used retries, a timeout and a step memory limit, and succeeded on attempt 1"
      type: "file"
      source: "validation/validate-retry-run.sh"
    - name: "validate-diagnosis"
      description: "Confirms the ConfigMap nightly-diagnosis holds the reason of nightly-report-timeout"
      type: "file"
      source: "validation/validate-diagnosis.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
