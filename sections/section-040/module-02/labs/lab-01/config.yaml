# Diagnose A Failing Archive Task
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-lab-040-02-setup"
      description: "Applies the Task archive and the TaskRun archive-run, which fails"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-archive-diagnosis"
      description: "Confirms the ConfigMap archive-diagnosis names the failed step and its exit code from archive-run"
      type: "file"
      source: "validation/validate-archive-diagnosis.sh"
    - name: "validate-archive-fixed"
      description: "Confirms the Task archive-fixed and archive-fixed-run succeeded with the result size"
      type: "file"
      source: "validation/validate-archive-fixed.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
