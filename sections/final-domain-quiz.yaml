schema_version: 1
kind: question_bank
id: ats125-final
course_id: ATS125
exam_code: TEKTON
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: tasks-steps-workspaces
  title: "Tasks, Steps & Workspaces"
questions:
  - id: ats125-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the rule for script and command"
    source_readings:
      - sections/section-010/module-01/course-01-steps-command-script-and-environment.md
    prompt: "A step sets both `script` and `command`. What happens when you apply the `Task`?"
    options:
      - id: a
        text: "The webhook rejects the `Task`, because a step has `script` or `command`, never both."
        explanation: "Correct. The two fields exclude each other."
      - id: b
        text: "The `script` runs and the `command` is ignored."
        explanation: "Not correct. The webhook does not pick one. It rejects the step."
      - id: c
        text: "The `command` runs first and the `script` runs after it."
        explanation: "Not correct. A step runs only one of them."
      - id: d
        text: "The `Task` is accepted and the `TaskRun` fails with `StepFailed`."
        explanation: "Not correct. The error comes at apply time, before any run."
    correct_option: a
    explanation: "Correct. The two fields exclude each other."

  - id: ats125-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what happens with a wrong parameter type"
    source_readings:
      - sections/section-010/module-01/course-02-parameter-types-and-defaults.md
    prompt: "A `TaskRun` passes the string `engines sensors` for a parameter that the `Task` declares as `array`. What happens?"
    options:
      - id: a
        text: "Tekton splits the string at the space and the run succeeds."
        explanation: "Not correct. Tekton never splits a string into an array."
      - id: b
        text: "The pod starts and the step fails with exit code 1."
        explanation: "Not correct. The check happens before the pod is created."
      - id: c
        text: "The `Task` default is used and the passed value is ignored."
        explanation: "Not correct. A passed value is checked, and a wrong type is an error."
      - id: d
        text: "The run fails with `TaskRunValidationFailed` before a pod exists."
        explanation: "Correct. Tekton does not split strings, and it checks the types before it creates the pod."
    correct_option: d
    explanation: "Correct. Tekton does not split strings, and it checks the types before it creates the pod."

  - id: ats125-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a result without a newline"
    source_readings:
      - sections/section-010/module-01/course-03-task-results-and-step-results.md
    prompt: "A step writes a result with `echo 2 > \"$(results.tag-count.path)\"`. What value does the `TaskRun` report?"
    options:
      - id: a
        text: "`2`, because Tekton removes the newline."
        explanation: "Not correct. Tekton does not trim results."
      - id: b
        text: "An empty value, because `echo` writes to the log only."
        explanation: "Not correct. The redirect writes the file that Tekton reads."
      - id: c
        text: "`2` followed by a newline, so use `printf '%s'` to write the exact value."
        explanation: "Correct. Tekton keeps the result exactly as the step wrote it."
      - id: d
        text: "The run fails, because results must end with a newline."
        explanation: "Not correct. No newline is required."
    correct_option: c
    explanation: "Correct. Tekton keeps the result exactly as the step wrote it."

  - id: ats125-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what happens with an unbound workspace"
    source_readings:
      - sections/section-020/module-01/course-01-declare-workspaces-and-bind-emptydir.md
    prompt: "A `TaskRun` does not bind a workspace that the `Task` declares without `optional`. What happens?"
    options:
      - id: a
        text: "The step runs and `$(workspaces.<name>.path)` is empty."
        explanation: "Not correct. Only an optional workspace gives an empty path."
      - id: b
        text: "The run fails with `TaskRunValidationFailed` before a pod exists."
        explanation: "Correct. The message says the declared workspace is required but has not been bound."
      - id: c
        text: "Tekton binds an `emptyDir` on its own."
        explanation: "Not correct. A default binding exists only if the `config-defaults` ConfigMap sets one."
      - id: d
        text: "The pod starts and the first step is `Skipped`."
        explanation: "Not correct. The check fails before the pod is created."
    correct_option: b
    explanation: "Correct. The message says the declared workspace is required but has not been bound."

  - id: ats125-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit a Secret to one step"
    source_readings:
      - sections/section-020/module-01/course-02-configmap-and-secret-workspaces.md
    prompt: "How do you mount a Secret workspace into only one step?"
    options:
      - id: a
        text: "List the workspace under `workspaces` of that step, which makes it an isolated workspace."
        explanation: "Correct. Only steps that list it mount it."
      - id: b
        text: "Set `readOnly: true` in the declaration."
        explanation: "Not correct. `readOnly` changes the mode and does not limit the steps."
      - id: c
        text: "Set `optional: true` in the declaration."
        explanation: "Not correct. `optional` lets the run leave the workspace out."
      - id: d
        text: "Bind the Secret with `subPath` set to the step name."
        explanation: "Not correct. `subPath` picks a folder of a volume and does not pick steps."
    correct_option: a
    explanation: "Correct. Only steps that list it mount it."

  - id: ats125-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Stay inside the one-PVC rule"
    source_readings:
      - sections/section-020/module-01/course-03-persistent-workspaces-with-pvcs.md
    prompt: "With the default `coschedule: workspaces`, a `TaskRun` binds two different PersistentVolumeClaims. What happens, and what is a clean fix?"
    options:
      - id: a
        text: "The run succeeds, because each workspace has its own volume."
        explanation: "Not correct. The default `coschedule` setting refuses it."
      - id: b
        text: "The run fails only if the claims use `ReadWriteOnce`."
        explanation: "Not correct. The access mode does not matter for this check."
      - id: c
        text: "The run fails. Set `coschedule` to another value in that `Task`."
        explanation: "Not correct. `coschedule` is a cluster-wide setting of an administrator."
      - id: d
        text: "The run fails with `TaskRunValidationFailed`. Bind one claim with two `subPath` values, or use an `emptyDir` for one workspace."
        explanation: "Correct. The controller allows only one PersistentVolumeClaim per `TaskRun`."
    correct_option: d
    explanation: "Correct. The controller allows only one PersistentVolumeClaim per `TaskRun`."

  - id: ats125-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the end states of steps after a failure"
    source_readings:
      - sections/section-030/module-01/course-01-taskrun-lifecycle-and-step-states.md
    prompt: "In a `Task` with three steps, the second step exits with code 3. What do `status.steps` and the `TaskRun` show?"
    options:
      - id: a
        text: "The second step is `Error`, the third is `Completed`, and the run is `Succeeded`."
        explanation: "Not correct. A failed step skips the steps after it."
      - id: b
        text: "The second step is `Continued` and the third is `Completed`."
        explanation: "Not correct. `Continued` needs `onError: continue`."
      - id: c
        text: "The second step is `Error`, the third is `Skipped`, and the run has the reason `StepFailed`."
        explanation: "Correct. Only the first failed step holds the real error."
      - id: d
        text: "All three steps are `Error` and the reason is `TaskRunTimeout`."
        explanation: "Not correct. The first step ended with `Completed`, and no timeout happened."
    correct_option: c
    explanation: "Correct. Only the first failed step holds the real error."

  - id: ats125-final-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain onError continue"
    source_readings:
      - sections/section-030/module-01/course-02-onerror-and-exit-codes.md
    prompt: "What does `onError: continue` do on a step that exits with a non-zero code?"
    options:
      - id: a
        text: "The step is retried until it exits with 0."
        explanation: "Not correct. `onError` does not retry. `spec.retries` retries a whole run."
      - id: b
        text: "The step shows `Continued` with its real exit code, and the next step starts."
        explanation: "Correct. The failure stays in `status.steps`."
      - id: c
        text: "The exit code is changed to 0 in `status.steps`."
        explanation: "Not correct. The real exit code is kept."
      - id: d
        text: "The remaining steps are skipped and the run is `Succeeded`."
        explanation: "Not correct. The next step runs as if the step had passed."
    correct_option: b
    explanation: "Correct. The failure stays in `status.steps`."

  - id: ats125-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Share storage between a build step and a push step"
    source_readings:
      - sections/section-030/module-01/course-03-build-and-push-an-image.md
    prompt: "The build and push steps are separate steps. What must they share, and why?"
    options:
      - id: a
        text: "A volume mounted at `/var/lib/containers`, because Buildah keeps its images there and the folder is private to each container."
        explanation: "Correct. Without it, the push step does not know the image."
      - id: b
        text: "The `source` workspace only, because Buildah keeps images in `/workspace`."
        explanation: "Not correct. Buildah keeps images in `/var/lib/containers`."
      - id: c
        text: "Nothing, because the steps run in one container."
        explanation: "Not correct. Each step is its own container."
      - id: d
        text: "A Secret with the registry credentials."
        explanation: "Not correct. The registry in the lab needs no login, and a Secret does not carry images."
    correct_option: a
    explanation: "Correct. Without it, the push step does not know the image."

  - id: ats125-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Use a StepAction from a Task"
    source_readings:
      - sections/section-010/module-02/course-01-write-a-stepaction-and-use-it-with-ref.md
    prompt: "Which field of a Task step uses a `StepAction`?"
    options:
      - id: a
        text: "`taskRef`, as in a `TaskRun`."
        explanation: "Not correct. `taskRef` belongs to a `TaskRun` or a Pipeline task."
      - id: b
        text: "`uses`, followed by the name."
        explanation: "Not correct. Tekton has no `uses` field in a step."
      - id: c
        text: "`ref`, with the field `name` set to the `StepAction`."
        explanation: "Correct. A step with `ref.name` runs the `StepAction`."
      - id: d
        text: "`image`, set to the name of the `StepAction`."
        explanation: "Not correct. `image` names a container image."
    correct_option: c
    explanation: "Correct. A step with `ref.name` runs the `StepAction`."

  - id: ats125-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a result in a later step"
    source_readings:
      - sections/section-010/module-02/course-03-return-results-from-a-stepaction.md
    prompt: "A step named `measure` wrote the step result `size`. How does a later step read it in `env`?"
    options:
      - id: a
        text: "`$(step.results.size.path)`"
        explanation: "Not correct. That is the file path in the step that writes it."
      - id: b
        text: "`$(results.measure.size)`"
        explanation: "Not correct. That form does not exist."
      - id: c
        text: "`$(tasks.measure.results.size)`"
        explanation: "Not correct. `tasks` is for Pipelines."
      - id: d
        text: "`$(steps.measure.results.size)`"
        explanation: "Correct. Later steps read a result with `$(steps.<step>.results.<name>)`."
    correct_option: d
    explanation: "Correct. Later steps read a result with `$(steps.<step>.results.<name>)`."

  - id: ats125-final-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Read one key"
    source_readings:
      - sections/section-010/module-03/course-01-object-parameters-and-their-properties.md
    prompt: "The object parameter `ship` has the key `name`. How do you read the key?"
    options:
      - id: a
        text: "`$(params.ship.name)`"
        explanation: "Correct. A key is read with a dot after the parameter name."
      - id: b
        text: "`$(params.ship[name])`"
        explanation: "Not correct. This form does not exist for objects."
      - id: c
        text: "`$(params.ship->name)`"
        explanation: "Not correct. This is not a variable form."
      - id: d
        text: "`$(ship.name)`"
        explanation: "Not correct. Parameters are always under `params`."
    correct_option: a
    explanation: "Correct. A key is read with a dot after the parameter name."

  - id: ats125-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the effect of invalid JSON"
    source_readings:
      - sections/section-010/module-03/course-02-array-and-object-results.md
    prompt: "A step exits with 0 but writes text that is not JSON into an array result. What happens?"
    options:
      - id: a
        text: "The run succeeds and the result is an empty array."
        explanation: "Not correct. The value is checked after the pod ends."
      - id: b
        text: "The run fails."
        explanation: "Correct. A result that is not valid JSON fails the run even if the step exits with 0."
      - id: c
        text: "The run succeeds with a string result."
        explanation: "Not correct. The declared type is array."
      - id: d
        text: "The step is run again."
        explanation: "Not correct. Retries only happen when `retries` is set."
    correct_option: b
    explanation: "Correct. A result that is not valid JSON fails the run even if the step exits with 0."

  - id: ats125-final-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Know that /tmp is not shared"
    source_readings:
      - sections/section-020/module-02/course-01-task-volumes-and-volumemounts.md
    prompt: "Step one writes `/tmp/a.txt`. Can step two read it?"
    options:
      - id: a
        text: "Yes, `/tmp` is shared by the pod."
        explanation: "Not correct. Only mounted volumes and `/workspace` are shared."
      - id: b
        text: "Yes, but only if both steps use the same image."
        explanation: "Not correct. The image does not matter."
      - id: c
        text: "No. Each step has its own file system outside shared volumes."
        explanation: "Correct. Use `/workspace` or a volume."
      - id: d
        text: "Yes, after `sync` runs."
        explanation: "Not correct. There is no such step."
    correct_option: c
    explanation: "Correct. Use `/workspace` or a volume."

  - id: ats125-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know how a sidecar ends"
    source_readings:
      - sections/section-020/module-02/course-04-sidecar-lifecycle-and-readiness.md
    prompt: "What does the controller do to a sidecar when the last step ends?"
    options:
      - id: a
        text: "It sends a signal to the sidecar."
        explanation: "Not correct. The controller replaces the image."
      - id: b
        text: "It deletes the pod at once."
        explanation: "Not correct. The pod must report the result first."
      - id: c
        text: "Nothing. The pod waits for the sidecar."
        explanation: "Not correct. That would make the run hang."
      - id: d
        text: "It replaces the image with the `nop` image so that the container ends."
        explanation: "Correct. The `nop` image ends the container."
    correct_option: d
    explanation: "Correct. The `nop` image ends the container."

  - id: ats125-final-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the default timeout"
    source_readings:
      - sections/section-040/module-01/course-01-timeouts-for-a-taskrun-and-a-step.md
    prompt: "A `TaskRun` sets no `timeout`. What limit applies by default?"
    options:
      - id: a
        text: "60 minutes, from `default-timeout-minutes`."
        explanation: "Correct. The value comes from the ConfigMap `config-defaults`."
      - id: b
        text: "No limit."
        explanation: "Not correct. Only `0` means no limit."
      - id: c
        text: "10 minutes."
        explanation: "Not correct. The default is 60 minutes."
      - id: d
        text: "1 minute."
        explanation: "Not correct. The default is 60 minutes."
    correct_option: a
    explanation: "Correct. The value comes from the ConfigMap `config-defaults`."

  - id: ats125-final-q17
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a timeout failure"
    source_readings:
      - sections/section-040/module-01/course-01-timeouts-for-a-taskrun-and-a-step.md
    prompt: "Which reason does the `Succeeded` condition show after a `TaskRun` exceeds its timeout?"
    options:
      - id: a
        text: "`Failed`"
        explanation: "Not correct. `Failed` is used when a step fails."
      - id: b
        text: "`TaskRunTimeout`"
        explanation: "Correct. The controller deletes the pod."
      - id: c
        text: "`TaskRunCancelled`"
        explanation: "Not correct. That is the reason after a cancel."
      - id: d
        text: "`ToBeRetried`"
        explanation: "Not correct. That is the reason while a retry waits."
    correct_option: b
    explanation: "Correct. The controller deletes the pod."

  - id: ats125-final-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Count attempts"
    source_readings:
      - sections/section-040/module-01/course-02-retries-and-the-retry-count.md
    prompt: "With `retries: 2`, how many attempts can a `TaskRun` make at most?"
    options:
      - id: a
        text: "Two."
        explanation: "Not correct. The first attempt is not a retry."
      - id: b
        text: "Four."
        explanation: "Not correct. Retries add two to the first attempt."
      - id: c
        text: "Three."
        explanation: "Correct. One first attempt plus two retries."
      - id: d
        text: "One."
        explanation: "Not correct. Retries add attempts."
    correct_option: c
    explanation: "Correct. One first attempt plus two retries."

  - id: ats125-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the pending state"
    source_readings:
      - sections/section-040/module-01/course-03-cancel-and-pending-runs.md
    prompt: "What happens to a `TaskRun` created with `spec.status: TaskRunPending`?"
    options:
      - id: a
        text: "It runs once and then waits."
        explanation: "Not correct. It does not start."
      - id: b
        text: "It is deleted after the timeout."
        explanation: "Not correct. The clock is not running."
      - id: c
        text: "It fails with `TaskRunTimeout`."
        explanation: "Not correct. The clock is not running."
      - id: d
        text: "The controller creates no pod, and the timeout clock does not run until the field is removed."
        explanation: "Correct. The reason in the condition is `TaskRunPending`."
    correct_option: d
    explanation: "Correct. The reason in the condition is `TaskRunPending`."

  - id: ats125-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the step container"
    source_readings:
      - sections/section-040/module-02/course-02-logs-and-cleanup.md
    prompt: "A Task has a step named `second`. Which container holds its log?"
    options:
      - id: a
        text: "`step-second`"
        explanation: "Correct. Use `kubectl logs POD -c step-second`."
      - id: b
        text: "`second`"
        explanation: "Not correct. Tekton adds a prefix."
      - id: c
        text: "`sidecar-second`"
        explanation: "Not correct. That prefix is for sidecars."
      - id: d
        text: "`prepare`"
        explanation: "Not correct. That container is not the step."
    correct_option: a
    explanation: "Correct. Use `kubectl logs POD -c step-second`."

  - id: ats125-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the failed step"
    source_readings:
      - sections/section-040/module-02/course-03-reading-status-and-termination-reasons.md
    prompt: "Where is the fastest place to see which step of a failed run failed and with which exit code?"
    options:
      - id: a
        text: "The `spec` of the `TaskRun`."
        explanation: "Not correct. The spec is what you asked for."
      - id: b
        text: "The message of the `Succeeded` condition."
        explanation: "Correct. The message looks like `\"step-name\" exited with code 7`."
      - id: c
        text: "The Task `metadata`."
        explanation: "Not correct. It has no run data."
      - id: d
        text: "The events of the node."
        explanation: "Not correct. The message already names the step."
    correct_option: b
    explanation: "Correct. The message looks like `\"step-name\" exited with code 7`."
