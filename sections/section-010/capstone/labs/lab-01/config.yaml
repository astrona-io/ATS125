# Repair A Task Built From Steps, Parameters And Results (section 010 capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-capstone-010-setup"
      description: "Applies the Secret report-token, the Task crew-manifest with three faults and the TaskRun crew-manifest-run, and waits until it has failed"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-crew-manifest-run"
      description: "Confirms crew-manifest-run uses the Task with the expected parameters, ran three steps and succeeded"
      type: "file"
      source: "validation/validate-crew-manifest-run.sh"
    - name: "validate-crew-manifest-results"
      description: "Confirms crew-manifest-run reports crew-count 3 and summary 'engineering: 3 crew members'"
      type: "file"
      source: "validation/validate-crew-manifest-results.sh"
    - name: "validate-task-crew-manifest"
      description: "Confirms the Secret is unchanged, crew-count still comes from a step result, and a grader run reports the right results"
      type: "file"
      source: "validation/validate-task-crew-manifest.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
