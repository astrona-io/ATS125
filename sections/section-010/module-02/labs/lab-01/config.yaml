# Write A Task From A StepAction
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-lab-010-02-setup"
      description: "Applies the StepAction compose-line"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-task-launch-log"
      description: "Confirms the Task launch-log uses the StepAction compose-line with ref and exposes the result entry"
      type: "file"
      source: "validation/validate-task-launch-log.sh"
    - name: "validate-launch-log-run"
      description: "Confirms launch-log-run uses the Task, passes the message and succeeded with the exact entry"
      type: "file"
      source: "validation/validate-launch-log-run.sh"
    - name: "validate-grader-launch-log"
      description: "Runs a grader TaskRun of launch-log with its own message and checks the entry"
      type: "file"
      source: "validation/validate-grader-launch-log.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
