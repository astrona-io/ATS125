# Repair A Task's Parameters, Environment And Results
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-125-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton"
      description: "Installs the tkn CLI 0.46.2 and Tekton Pipelines v1.17.1, and waits until the webhook answers"
      type: "file"
      source: "bootstrap/01-install-tekton.sh"
    - name: "ats-125-lab-010-01-setup"
      description: "Applies the Task image-tag and the TaskRun image-tag-run, and waits until the TaskRun has failed"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-tekton"
      description: "Waits until every Tekton Deployment is ready"
      type: "file"
      source: "testing/wait-for-tekton.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-image-tag-run"
      description: "Confirms image-tag-run uses the Task image-tag, passes labels as an array and succeeded"
      type: "file"
      source: "validation/validate-image-tag-run.sh"
    - name: "validate-image-tag-results"
      description: "Confirms image-tag-run reports the expected image-ref and label-count, with no newline"
      type: "file"
      source: "validation/validate-image-tag-results.sh"
    - name: "validate-task-image-tag"
      description: "Confirms REGISTRY comes from the stepTemplate and a grader run with three labels reports the right results"
      type: "file"
      source: "validation/validate-task-image-tag.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
