# Reference end state of the TaskRun: labels is passed as an array.
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: image-tag-run
  namespace: starfleet
spec:
  taskRef:
    name: image-tag
  params:
    - name: app
      value: bridge
    - name: version
      value: "2.1"
    - name: labels
      value:
        - team=bridge
        - tier=web
