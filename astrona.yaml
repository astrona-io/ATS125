# Course manifest for ATS125 - Tasks, Steps & Workspaces (Tekton).
#
# One entry per module under `modules:`, in section order. A module lists,
# in order: the section README when it opens a section, its landing page
# (course.md), its parts (course-0N-*.md), and right after the part a lab
# tests, the lab's question.md reading and the `type: lab` entry. The
# module's summary page and knowledge check come last. The last module of a
# section also carries the section capstone and the section knowledge check.
# Playgrounds are not listed: the playground marker on the landing page shows
# them. solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS125
  title: "Tekton: Tasks, Steps & Workspaces"
  maturity: alpha
  description: >
    Training material covering the Tasks, Steps & Workspaces domain of the
    Tekton training path: the anatomy of a Task (steps with command, args or
    script, env and envFrom, workingDir, computeResources, stepTemplate and
    StepActions), string, array and object parameters with defaults, Task
    results and step results, sharing files through workspaces bound to
    emptyDir, ConfigMap, Secret, PersistentVolumeClaim and volumeClaimTemplate
    volumes, Task volumes and sidecars, the TaskRun lifecycle and step
    termination states, TaskRun timeout, retries, cancel and pending runs,
    debugging with tkn, onError and
    step exit codes as the exit handler of a Task, and a containerized build
    Task that builds an image with Buildah from a workspace, pushes it to a
    registry and reports its digest. Each module pairs a layered reader with
    an ungraded hands-on playground and a graded practice lab. Each section
    closes with an integration capstone. Written for Tekton Pipelines
    v1.17.1, tkn v0.46.2 and Buildah v1.43.5.

  certification:
    name: Tekton
    code: TEKTON
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
